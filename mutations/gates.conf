# Mutation spec for customfield_pattern — run with
# `mdl mutate moodle-customfield_pattern /Users/uaiblaine/dev/moodle-customfield_pattern/mutations/gates.conf --fast --db pgsql`
# (and --db mariadb).
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it. A gate with no
# `->` line is one the author expects NO test to hold: its result is the finding, not a pass.
#
#     tag | file relative to the repo | perl script relative to this file

# --- Public API: configuration rules -----------------------------------------------------------------
A1_unknown_preset_accepted | classes/api.php | a1_unknown_preset_accepted.pl
#   -> api_test::test_config_errors
#   -> field_controller_test::test_config_form_validation

A2_unknown_storeformat_accepted | classes/api.php | a2_unknown_storeformat_accepted.pl
#   -> api_test::test_config_errors
#   -> field_controller_test::test_config_form_validation

A3_maxlength_below_mask_accepted | classes/api.php | a3_maxlength_below_mask_accepted.pl
#   -> api_test::test_config_errors
#   -> field_controller_test::test_config_form_validation

A4_raw_maxlength_counts_literals | classes/api.php | a4_raw_maxlength_counts_literals.pl
#   -> api_test::test_config_errors
#   -> field_controller_test::test_config_form_validation

# --- Public API: values, input and JavaScript --------------------------------------------------------
A5_non_scalar_settings_kept | classes/api.php | a5_non_scalar_settings_kept.pl
