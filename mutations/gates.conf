# Expected to redden nothing: PCRE2's JIT honours the same match limit, so on these builds the
# answer and its time do not depend on it. Kept off so the bound does not depend on the build.
R4_jit_left_on | classes/local/pattern.php | r4_jit_left_on.pl

R5_limits_not_restored | classes/local/pattern.php | r5_limits_not_restored.pl
#   -> api_test::test_catastrophic_regex_is_bounded

R6_unchecked_reads_as_no_match | classes/local/pattern.php | r6_unchecked_reads_as_no_match.pl
#   -> api_test::test_catastrophic_regex_is_bounded

