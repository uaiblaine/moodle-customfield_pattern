# --- Controllers over the API ----------------------------------------------------------------------
C1_controller_skips_shared_rules | classes/field_controller.php | c1_controller_skips_shared_rules.pl
#   -> field_controller_test::test_config_form_validation
#   -> field_controller_test::test_config_form_submission

C2_masked_input_never_registered | classes/data_controller.php | c2_masked_input_never_registered.pl
#   -> data_controller_test::test_the_mask_module_is_required_when_the_form_is_rendered

# --- Bounded regular expressions (an admin-set regex runs on user input) ---------------------------
R1_regex_length_uncapped | classes/api.php | r1_regex_length_uncapped.pl
#   -> api_test::test_config_errors_bound_the_regex

R2_regex_probe_skipped | classes/api.php | r2_regex_probe_skipped.pl
#   -> api_test::test_config_errors_bound_the_regex
#   -> field_controller_test::test_config_form_validation

R3_match_limit_not_lowered | classes/local/pattern.php | r3_match_limit_not_lowered.pl
